name: Run tests

on:
  push:
    branches: [reorganize_codebase]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    name: Test on ${{ matrix.os }}, Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy: 
      matrix:
        os: [macOS-latest, ubuntu-latest] #, windows-latest] mmcif no windows build
        python-version: ["3.9", "3.10", "3.11"]

    steps:
        - uses: actions/checkout@v3
        - uses: actions/setup-python@v4
          with: 
              python-version: '3.10'

        - name: Install package
          run: pip install .[test]

        - name: Run tests
          run: pytest -v --cov=ihm_vis --junitxml=junit.xml --html=report.html


        # TODO 
        # use genbadge or coverage-badge to 
        # report the status of the tests
        # but dont want to get sucked into that
        # before doing other documentation



